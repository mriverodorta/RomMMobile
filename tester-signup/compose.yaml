services:
  signup:
    build: .
    restart: unless-stopped
    labels:
      com.centurylinklabs.watchtower.enable: "false"
    ports:
      - "${SIGNUP_BIND_IP:-127.0.0.1}:${SIGNUP_PORT:-8768}:8080"
    volumes:
      - "${SIGNUP_DATA_DIR:-./data}:/data"
    read_only: true
    tmpfs:
      - /tmp:noexec,nosuid,nodev,mode=1777,size=16m
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    pids_limit: 32
    mem_limit: 128m
    cpus: 1
    healthcheck:
      test: ["CMD", "python", "-c", "from urllib.request import urlopen; urlopen('http://127.0.0.1:8080/healthz', timeout=2).close()"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 5s
